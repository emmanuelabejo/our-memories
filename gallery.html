<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gallery</title>

        <style>
            :root {
                --night: #14213d;
                --paper: #f3e9d2;
                --ink: #2b2118;
                --gold: #d9a441;
                --gold-dark: #b9822a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 20px;
                background: radial-gradient(circle at top, #243b6b, var(--night));
                color: var(--paper);
                font-family: Georgia, "Times New Roman", serif;
                text-align: center;
            }

            h1 {
                margin: 0;
                font-size: clamp(2rem, 6vw, 3.2rem);
                letter-spacing: 0.12em;
            }

            .subtitle {
                margin: 8px 0 12px;
                font-style: italic;
                opacity: 0.85;
            }

            h2 {
                margin: 48px 0 16px;
                font-size: 1.6rem;
            }

            section {
                width: 100%;
                max-width: 900px;
            }

            /* ---------- Photos ---------- */
            #photo-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 24px;
            }

            figure {
                margin: 0;
                width: 260px;
                padding: 10px 10px 14px;
                background: var(--paper);
                color: var(--ink);
                border-radius: 4px;
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
            }

            figure:nth-child(odd) {
                transform: rotate(-1.5deg);
            }

            figure:nth-child(even) {
                transform: rotate(1.2deg);
            }

            .tile {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 200px;
                padding: 0;
                border: 2px solid var(--ink);
                background: #c9b88f;
                color: var(--ink);
                font-family: inherit;
                font-size: 1rem;
                cursor: pointer;
                overflow: hidden;
            }

            .tile.empty {
                border-style: dashed;
            }

            .tile img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .remove-btn {
                margin-top: 8px;
                padding: 4px 14px;
                border: 2px solid var(--ink);
                border-radius: 999px;
                background: transparent;
                color: var(--ink);
                font-family: inherit;
                font-size: 0.8rem;
                cursor: pointer;
            }

            .remove-btn:hover {
                background: var(--gold);
            }

            figcaption {
                margin-top: 10px;
                font-size: 0.95rem;
            }

            /* ---------- Video and audio ---------- */
            .media-card {
                width: 100%;
                max-width: 560px;
                margin: 0 auto;
                padding: 14px;
                background: var(--paper);
                color: var(--ink);
                border-radius: 6px;
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
                transform: none !important;
            }

            .media-card video {
                display: block;
                width: 100%;
                border: 2px solid var(--ink);
                background: #1b1b1b;
            }

            .media-card audio {
                width: 100%;
            }

            .note {
                min-height: 1.4em;
                margin: 8px 0 0;
                font-size: 0.9rem;
            }

            /* ---------- Buttons ---------- */
            .next-btn,
            .back-btn,
            .small-btn,
            .lb-btn {
                padding: 10px 24px;
                border-radius: 999px;
                font-family: inherit;
                font-size: 1rem;
                cursor: pointer;
                transition: transform 0.15s, background-color 0.15s;
            }

            .next-btn {
                border: none;
                background: var(--gold);
                color: var(--ink);
                font-weight: bold;
            }

            .next-btn:hover {
                background: var(--gold-dark);
                transform: translateY(-2px);
            }

            .back-btn,
            .small-btn,
            .lb-btn {
                border: 2px solid var(--gold);
                background: transparent;
                color: var(--paper);
            }

            .back-btn:hover,
            .small-btn:hover,
            .lb-btn:hover {
                background: rgba(217, 164, 65, 0.2);
            }

            .media-card .small-btn {
                margin-top: 12px;
                color: var(--ink);
                border-color: var(--ink);
            }

            .media-card .small-btn:hover {
                background: var(--gold);
            }

            .section-actions {
                margin-top: 24px;
            }

            .nav {
                display: flex;
                gap: 12px;
                margin-top: 56px;
            }

            button:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 3px;
            }

            /* ---------- Big photo viewer ---------- */
            #lightbox {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 16px;
                padding: 20px;
                background: rgba(8, 12, 24, 0.94);
            }

            #lightbox.open {
                display: flex;
            }

            #lb-img {
                max-width: 100%;
                max-height: 70vh;
                border: 6px solid var(--paper);
                border-radius: 3px;
            }

            .lb-controls {
                display: flex;
                gap: 10px;
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>

    <body>
        <h1>Gallery</h1>
        <p class="subtitle">Moments Together</p>

        <!-- PHOTOS -->
        <section>
            <h2>Photos</h2>
            <div id="photo-grid"></div>
            <div class="section-actions">
                <button class="small-btn" id="add-photos-btn">Add more photos</button>
            </div>
        </section>

        <!-- VIDEO -->
        <section>
            <h2>Video</h2>
            <figure class="media-card">
                <video id="video" loop controls playsinline></video>
                <figcaption>Our video</figcaption>
                <p class="note" id="video-note"></p>
                <button class="small-btn" id="video-btn">Choose a video</button>
            </figure>
        </section>

        <!-- AUDIO -->
        <section>
            <h2>Audio</h2>
            <figure class="media-card">
                <audio id="audio" controls></audio>
                <figcaption>Our song</figcaption>
                <p class="note" id="audio-note"></p>
                <button class="small-btn" id="audio-btn">Choose a song</button>
            </figure>
        </section>

        <div class="nav">
            <button class="back-btn" onclick="window.location.href='photobooth.html'">Back</button>
            <button class="next-btn" onclick="window.location.href='messages.html'">Next</button>
        </div>

        <!-- Big photo viewer -->
        <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
            <img id="lb-img" alt="" />
            <p id="lb-caption"></p>
            <div class="lb-controls">
                <button class="lb-btn" id="lb-prev">Previous</button>
                <button class="lb-btn" id="lb-next">Next</button>
                <button class="lb-btn" id="lb-close">Close</button>
            </div>
        </div>

        <!-- Hidden file pickers -->
        <input type="file" id="pick-one" accept="image/*" hidden />
        <input type="file" id="pick-many" accept="image/*" multiple hidden />
        <input type="file" id="pick-video" accept="video/*" hidden />
        <input type="file" id="pick-audio" accept="audio/*" hidden />

        <script>
            // ---------- Your media: put file names or web links here ----------
            // Leave src empty ("") to show an "Add photo" slot you can fill from the page.
            const photos = [
                { src: "", caption: "Our first pic" },
                { src: "", caption: "Our second pic" },
                { src: "", caption: "Our third pic" }
            ];
            const VIDEO_SRC = "https://cdn.pixabay.com/video/2015/08/24/552-137115422_large.mp4";
            const AUDIO_SRC = "";

            // ---------- Find the elements ----------
            const grid = document.getElementById("photo-grid");
            const video = document.getElementById("video");
            const audio = document.getElementById("audio");
            const videoNote = document.getElementById("video-note");
            const audioNote = document.getElementById("audio-note");
            const pickOne = document.getElementById("pick-one");
            const pickMany = document.getElementById("pick-many");
            const pickVideo = document.getElementById("pick-video");
            const pickAudio = document.getElementById("pick-audio");
            const lightbox = document.getElementById("lightbox");
            const lbImg = document.getElementById("lb-img");
            const lbCaption = document.getElementById("lb-caption");

            let pendingIndex = 0; // which empty slot is being filled
            let lbIndex = 0; // position inside the viewer

            // ---------- Photos saved from the photobooth ----------
            const SAVED_KEY = "our-memories-saved-photos";

            function loadSaved() {
                try {
                    return JSON.parse(localStorage.getItem(SAVED_KEY)) || [];
                } catch (error) {
                    return [];
                }
            }

            function removeSaved(id) {
                const list = loadSaved().filter(function (p) {
                    return p.id !== id;
                });
                try {
                    localStorage.setItem(SAVED_KEY, JSON.stringify(list));
                } catch (error) {}
                renderPhotos();
            }

            // Your own photos first, then the photobooth photos
            function getAll() {
                const fromBooth = loadSaved().map(function (p) {
                    return { src: p.src, caption: p.caption, savedId: p.id };
                });
                return photos.concat(fromBooth);
            }

            // ---------- Photos ----------
            function renderPhotos() {
                grid.innerHTML = "";

                getAll().forEach(function (photo, i) {
                    const fig = document.createElement("figure");
                    const tile = document.createElement("button");
                    tile.className = "tile";

                    if (photo.src) {
                        const img = document.createElement("img");
                        img.src = photo.src;
                        img.alt = photo.caption;
                        // If the picture can't load, turn it into an empty slot
                        img.addEventListener("error", function () {
                            if (photo.savedId) return; // saved photos stay as they are
                            photo.src = "";
                            renderPhotos();
                        });
                        tile.append(img);
                        tile.setAttribute("aria-label", "View " + photo.caption);
                        tile.addEventListener("click", function () {
                            openViewer(i);
                        });
                    } else {
                        tile.classList.add("empty");
                        tile.textContent = "+ Add photo";
                        tile.addEventListener("click", function () {
                            pendingIndex = i;
                            pickOne.click();
                        });
                    }

                    const caption = document.createElement("figcaption");
                    caption.textContent = photo.caption;

                    fig.append(tile, caption);

                    // Photos saved from the photobooth can be removed
                    if (photo.savedId) {
                        const remove = document.createElement("button");
                        remove.className = "remove-btn";
                        remove.textContent = "Remove";
                        remove.addEventListener("click", function () {
                            removeSaved(photo.savedId);
                        });
                        fig.append(remove);
                    }

                    grid.append(fig);
                });
            }

            // Fill one empty slot
            pickOne.addEventListener("change", function () {
                const file = pickOne.files[0];
                if (file) {
                    photos[pendingIndex].src = URL.createObjectURL(file);
                    renderPhotos();
                }
                pickOne.value = "";
            });

            // Add several new photos at once
            document.getElementById("add-photos-btn").addEventListener("click", function () {
                pickMany.click();
            });

            pickMany.addEventListener("change", function () {
                Array.from(pickMany.files).forEach(function (file) {
                    photos.push({
                        src: URL.createObjectURL(file),
                        caption: file.name.replace(/\.[^.]+$/, "")
                    });
                });
                renderPhotos();
                pickMany.value = "";
            });

            // ---------- Big photo viewer ----------
            function shownPhotos() {
                return getAll().filter(function (p) {
                    return p.src;
                });
            }

            function openViewer(photoIndex) {
                // Count only the photos that have a picture, up to this one
                lbIndex = getAll()
                    .slice(0, photoIndex)
                    .filter(function (p) {
                        return p.src;
                    }).length;
                updateViewer();
                lightbox.classList.add("open");
                document.getElementById("lb-close").focus();
            }

            function updateViewer() {
                const list = shownPhotos();
                if (!list.length) return closeViewer();
                lbIndex = (lbIndex + list.length) % list.length;
                lbImg.src = list[lbIndex].src;
                lbImg.alt = list[lbIndex].caption;
                lbCaption.textContent =
                    list[lbIndex].caption + " (" + (lbIndex + 1) + " of " + list.length + ")";
            }

            function closeViewer() {
                lightbox.classList.remove("open");
            }

            document.getElementById("lb-prev").addEventListener("click", function () {
                lbIndex--;
                updateViewer();
            });
            document.getElementById("lb-next").addEventListener("click", function () {
                lbIndex++;
                updateViewer();
            });
            document.getElementById("lb-close").addEventListener("click", closeViewer);

            lightbox.addEventListener("click", function (event) {
                if (event.target === lightbox) closeViewer();
            });

            document.addEventListener("keydown", function (event) {
                if (!lightbox.classList.contains("open")) return;
                if (event.key === "Escape") closeViewer();
                if (event.key === "ArrowRight") {
                    lbIndex++;
                    updateViewer();
                }
                if (event.key === "ArrowLeft") {
                    lbIndex--;
                    updateViewer();
                }
            });

            // ---------- Video ----------
            if (VIDEO_SRC) video.src = VIDEO_SRC;

            video.addEventListener("error", function () {
                videoNote.textContent =
                    "This video couldn't load. Choose one from your computer instead.";
            });

            document.getElementById("video-btn").addEventListener("click", function () {
                pickVideo.click();
            });

            pickVideo.addEventListener("change", function () {
                const file = pickVideo.files[0];
                if (file) {
                    video.src = URL.createObjectURL(file);
                    video.load();
                    videoNote.textContent = "Now showing: " + file.name;
                }
                pickVideo.value = "";
            });

            // ---------- Audio ----------
            if (AUDIO_SRC) {
                audio.src = AUDIO_SRC;
            } else {
                audioNote.textContent = "No song yet. Choose one to play it here.";
            }

            audio.addEventListener("error", function () {
                if (audio.getAttribute("src")) {
                    audioNote.textContent = "This song couldn't load. Choose another file.";
                }
            });

            document.getElementById("audio-btn").addEventListener("click", function () {
                pickAudio.click();
            });

            pickAudio.addEventListener("change", function () {
                const file = pickAudio.files[0];
                if (file) {
                    audio.src = URL.createObjectURL(file);
                    audio.load();
                    audioNote.textContent = "Now showing: " + file.name;
                }
                pickAudio.value = "";
            });

            renderPhotos();
        </script>
    </body>
</html>
