<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Photobooth</title>

        <style>
            :root {
                --night: #14213d;
                --paper: #f3e9d2;
                --ink: #2b2118;
                --gold: #d9a441;
                --gold-dark: #b9822a;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px 20px;
                background: radial-gradient(circle at top, #243b6b, var(--night));
                color: var(--paper);
                font-family: Georgia, "Times New Roman", serif;
                text-align: center;
            }

            h1 {
                margin: 0;
                font-size: clamp(2rem, 6vw, 3.2rem);
                letter-spacing: 0.12em;
            }

            .hint {
                margin: 8px 0 24px;
                font-style: italic;
                opacity: 0.85;
            }

            /* ---------- Camera frame ---------- */
            .frame {
                position: relative;
                width: 100%;
                max-width: 560px;
                padding: 14px;
                background: var(--paper);
                border-radius: 6px;
                box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
            }

            #camera {
                display: block;
                width: 100%;
                aspect-ratio: 4 / 3;
                object-fit: cover;
                background: #1b1b1b;
                border: 2px solid var(--ink);
                transform: scaleX(-1); /* mirror, like a real mirror */
            }

            #countdown {
                position: absolute;
                inset: 14px;
                display: none;
                align-items: center;
                justify-content: center;
                font-size: 7rem;
                font-weight: bold;
                color: #fff;
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
                pointer-events: none;
            }

            #flash {
                position: absolute;
                inset: 14px;
                background: #fff;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.4s;
            }

            #flash.on {
                opacity: 1;
                transition: none;
            }

            #status {
                min-height: 1.5em;
                margin: 16px 0 4px;
            }

            /* ---------- Buttons ---------- */
            .buttons {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
                margin-top: 12px;
            }

            .snap-btn,
            .next-btn,
            .back-btn,
            .small-btn {
                padding: 12px 26px;
                border-radius: 999px;
                font-family: inherit;
                font-size: 1rem;
                cursor: pointer;
                transition: transform 0.15s, background-color 0.15s;
            }

            .snap-btn,
            .next-btn {
                border: none;
                background: var(--gold);
                color: var(--ink);
                font-weight: bold;
            }

            .snap-btn:hover,
            .next-btn:hover {
                background: var(--gold-dark);
                transform: translateY(-2px);
            }

            .back-btn,
            .small-btn {
                border: 2px solid var(--gold);
                background: transparent;
                color: var(--paper);
            }

            .back-btn:hover,
            .small-btn:hover {
                background: rgba(217, 164, 65, 0.2);
                transform: translateY(-2px);
            }

            button:disabled {
                opacity: 0.5;
                cursor: not-allowed;
                transform: none;
            }

            button:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 3px;
            }

            /* ---------- Review the photo: Save or Delete ---------- */
            .review {
                width: 100%;
                max-width: 360px;
                margin-top: 32px;
            }

            .review h2 {
                margin: 0 0 14px;
                font-size: 1.5rem;
            }

            .print {
                padding: 10px;
                background: var(--paper);
                border-radius: 4px;
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
                transform: rotate(-1.5deg);
            }

            .print img {
                display: block;
                width: 100%;
                border: 2px solid var(--ink);
            }

            #saved-count {
                margin: 24px 0 0;
                font-size: 0.95rem;
                opacity: 0.8;
            }

            .nav {
                display: flex;
                gap: 12px;
                margin-top: 40px;
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                }
            }
        </style>
    </head>

    <body>
        <h1>Photobooth</h1>
        <p class="hint">Get close together, smile, and press the button.</p>

        <div class="frame">
            <video id="camera" autoplay playsinline muted></video>
            <div id="countdown"></div>
            <div id="flash"></div>
        </div>

        <p id="status">Starting camera...</p>

        <div class="buttons">
            <button class="snap-btn" id="snap-btn" disabled>Take photo</button>
            <button class="small-btn" id="timer-btn">Timer: 3 seconds</button>
        </div>

        <!-- Shows after a photo is taken -->
        <div class="review" id="review" hidden>
            <h2>Keep this photo?</h2>
            <div class="print">
                <img id="preview" alt="The photo you just took" />
            </div>
            <div class="buttons">
                <button class="snap-btn" id="save-btn">Save</button>
                <button class="small-btn" id="delete-btn">Delete</button>
            </div>
        </div>

        <p id="saved-count"></p>

        <div class="nav">
            <button class="back-btn" onclick="window.location.href='index.html'">Back</button>
            <button class="next-btn" onclick="window.location.href='gallery.html'">Next</button>
        </div>

        <canvas id="canvas" hidden></canvas>

        <script>
            // The gallery page reads photos from this same storage name
            const SAVED_KEY = "our-memories-saved-photos";

            const video = document.getElementById("camera");
            const canvas = document.getElementById("canvas");
            const snapBtn = document.getElementById("snap-btn");
            const timerBtn = document.getElementById("timer-btn");
            const saveBtn = document.getElementById("save-btn");
            const deleteBtn = document.getElementById("delete-btn");
            const review = document.getElementById("review");
            const preview = document.getElementById("preview");
            const countdownEl = document.getElementById("countdown");
            const flash = document.getElementById("flash");
            const statusEl = document.getElementById("status");
            const savedCount = document.getElementById("saved-count");

            const timerOptions = [0, 3, 5, 10]; // seconds
            let timerIndex = 1;
            let busy = false;
            let pendingPhoto = null; // the photo waiting for Save or Delete

            // ---------- Saved photos (shared with the gallery) ----------
            function loadSaved() {
                try {
                    return JSON.parse(localStorage.getItem(SAVED_KEY)) || [];
                } catch (error) {
                    return [];
                }
            }

            function updateSavedCount() {
                const n = loadSaved().length;
                savedCount.textContent =
                    n === 0
                        ? "No photos saved to the gallery yet."
                        : n + (n === 1 ? " photo" : " photos") + " saved in the gallery.";
            }

            // ---------- 1. Start the camera ----------
            async function startCamera() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    statusEl.textContent =
                        "Camera needs a secure page. Open this file with Live Server or put it online.";
                    return;
                }
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "user" },
                        audio: false
                    });
                    video.srcObject = stream;
                    snapBtn.disabled = false;
                    statusEl.textContent = "Ready!";
                } catch (error) {
                    statusEl.textContent =
                        "Camera blocked. Click the camera icon in the address bar and choose Allow, then refresh.";
                }
            }

            // ---------- 2. Change the timer ----------
            timerBtn.addEventListener("click", function () {
                timerIndex = (timerIndex + 1) % timerOptions.length;
                const s = timerOptions[timerIndex];
                timerBtn.textContent = s === 0 ? "Timer: off" : "Timer: " + s + " seconds";
            });

            // ---------- 3. Countdown, then take the photo ----------
            function wait(ms) {
                return new Promise(function (resolve) {
                    setTimeout(resolve, ms);
                });
            }

            snapBtn.addEventListener("click", async function () {
                if (busy) return;
                busy = true;
                snapBtn.disabled = true;

                const seconds = timerOptions[timerIndex];
                if (seconds > 0) {
                    countdownEl.style.display = "flex";
                    for (let i = seconds; i > 0; i--) {
                        countdownEl.textContent = i;
                        await wait(1000);
                    }
                    countdownEl.style.display = "none";
                }

                takePhoto();
                busy = false;
                // The Take photo button stays off until you press Save or Delete
            });

            function takePhoto() {
                // Shrink the photo to keep browser storage small
                const scale = Math.min(1, 640 / video.videoWidth);
                const w = Math.round(video.videoWidth * scale);
                const h = Math.round(video.videoHeight * scale);
                canvas.width = w;
                canvas.height = h;

                const ctx = canvas.getContext("2d");
                // Flip the picture so it matches the mirrored preview
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
                ctx.drawImage(video, 0, 0, w, h);

                pendingPhoto = canvas.toDataURL("image/jpeg", 0.85);
                preview.src = pendingPhoto;
                review.hidden = false;
                review.scrollIntoView({ behavior: "smooth", block: "center" });

                // White flash effect
                flash.classList.add("on");
                setTimeout(function () {
                    flash.classList.remove("on");
                }, 80);

                statusEl.textContent = "Save it to the gallery, or delete it and try again.";
            }

            // ---------- 4. Save or Delete ----------
            function closeReview() {
                pendingPhoto = null;
                preview.removeAttribute("src");
                review.hidden = true;
                snapBtn.disabled = false;
            }

            saveBtn.addEventListener("click", function () {
                if (!pendingPhoto) return;

                const list = loadSaved();
                list.push({
                    id: Date.now(),
                    src: pendingPhoto,
                    caption:
                        "Photobooth, " +
                        new Date().toLocaleDateString(undefined, {
                            year: "numeric",
                            month: "short",
                            day: "numeric"
                        })
                });

                try {
                    localStorage.setItem(SAVED_KEY, JSON.stringify(list));
                } catch (error) {
                    statusEl.textContent =
                        "Couldn't save: browser storage is full or blocked. Delete some photos in the gallery and try again.";
                    return;
                }

                closeReview();
                statusEl.textContent = "Saved to the gallery! Take another or press Next.";
                updateSavedCount();
            });

            deleteBtn.addEventListener("click", function () {
                closeReview();
                statusEl.textContent = "Photo deleted. Ready for another one!";
            });

            updateSavedCount();
            startCamera();
        </script>
    </body>
</html>
